<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/web icon.svg" />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Roboto+Mono:wght@400;500;700&display=swap"
    />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.1.0/css/all.min.css"
      integrity="sha512-10/jx2EXwxxWqCLX/hHth/vu2KY3jCF70dCQB8TSgNjbCVAC/8vai53GfMDrO2Emgwccf2pJqxct9ehpzG+MTw=="
      crossorigin="anonymous"
      referrerpolicy="no-referrer"
    />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>
      Mohamed Ajmal — Senior Backend Engineer | Node.js, Python, Kubernetes
    </title>
    <meta
      name="description"
      content="Mohamed Ajmal (iamajhere) — Senior Backend Engineer building and operating a 20+ service multi-tenant SaaS platform on AWS with Node.js, Python, Kubernetes and ArgoCD."
    />
    <link rel="canonical" href="https://iamajhere.com/" />
    <meta name="author" content="Mohamed Ajmal" />

    <meta property="og:type" content="profile" />
    <meta property="og:url" content="https://iamajhere.com/" />
    <meta
      property="og:title"
      content="Mohamed Ajmal — Senior Backend Engineer | Node.js, Python, Kubernetes"
    />
    <meta
      property="og:description"
      content="Senior Backend Engineer building and operating a 20+ service multi-tenant SaaS platform on AWS with Node.js, Python, Kubernetes and ArgoCD."
    />
    <!-- Absolute URL required: scrapers do not resolve relative paths.
         Regenerate from docs/og-card.svg, see that file's header. -->
    <meta property="og:image" content="https://iamajhere.com/og-card.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta
      property="og:image:alt"
      content="Mohamed Ajmal — Senior Backend Engineer. Node.js, Python, Kubernetes, AWS."
    />
    <meta property="og:site_name" content="Mohamed Ajmal" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:creator" content="@iamajhere" />
    <meta name="twitter:image" content="https://iamajhere.com/og-card.png" />

    <!-- Links the name "Mohamed Ajmal" to the handle "iamajhere" for search engines.
         Keep sameAs in sync with the links in src/components/Sections/Contact.tsx. -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "Person",
        "name": "Mohamed Ajmal",
        "alternateName": "iamajhere",
        "url": "https://iamajhere.com/",
        "image": "https://avatars.githubusercontent.com/u/63549636?v=4",
        "jobTitle": "Senior Backend Engineer",
        "worksFor": {
          "@type": "Organization",
          "name": "Rooster HR"
        },
        "address": {
          "@type": "PostalAddress",
          "addressCountry": "LK"
        },
        "knowsAbout": [
          "Node.js",
          "Python",
          "TypeScript",
          "Distributed Systems",
          "Microservices",
          "Multi-tenant SaaS",
          "AWS",
          "Kubernetes",
          "ArgoCD",
          "Docker",
          "Terraform",
          "MongoDB",
          "MariaDB"
        ],
        "alumniOf": {
          "@type": "CollegeOrUniversity",
          "name": "London Metropolitan University"
        },
        "sameAs": [
          "https://github.com/IamAjhere",
          "https://www.linkedin.com/in/iamajhere",
          "https://leetcode.com/iamajhere",
          "https://www.instagram.com/iamajhere",
          "https://x.com/iamajhere"
        ]
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <form name="contact" data-netlify="true" hidden>
      <div>
        <input type="text" id="name" name="name" required />
      </div>
      <div>
        <input type="email" id="email" name="email" required />
      </div>
      <div>
        <textarea id="message" name="message" required></textarea>
      </div>
    </form>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
