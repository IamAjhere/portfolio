<?xml version="1.0" encoding="UTF-8"?>
<!-- Source for public/og-card.png. Render with:
     rsvg-convert -w 1200 -h 630 docs/og-card.svg -o public/og-card.png
     Text is drawn as <text>, so the renderer needs Helvetica/Arial present. -->
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0b1221"/>
      <stop offset="55%" stop-color="#111c33"/>
      <stop offset="100%" stop-color="#0a2a3d"/>
    </linearGradient>
    <linearGradient id="rule" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#36BDAE"/>
      <stop offset="100%" stop-color="#36BDAE" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="630" fill="url(#bg)"/>

  <!-- faint grid, keeps the flat background from looking empty -->
  <g stroke="#ffffff" stroke-opacity="0.04" stroke-width="1">
    <path d="M0 110h1200M0 220h1200M0 330h1200M0 440h1200M0 550h1200"/>
    <path d="M150 0v630M300 0v630M450 0v630M600 0v630M750 0v630M900 0v630M1050 0v630"/>
  </g>

  <circle cx="1035" cy="150" r="190" fill="#36BDAE" fill-opacity="0.07"/>

  <text x="90" y="150" font-family="Helvetica,Arial,sans-serif" font-size="25"
        font-weight="700" fill="#36BDAE" letter-spacing="4.5">IAMAJHERE.COM</text>

  <text x="90" y="268" font-family="Helvetica,Arial,sans-serif" font-size="82"
        font-weight="700" fill="#ffffff" letter-spacing="-1">Mohamed Ajmal</text>

  <text x="90" y="340" font-family="Helvetica,Arial,sans-serif" font-size="40"
        font-weight="400" fill="#c6d4e8">Senior Backend Engineer</text>

  <rect x="90" y="382" width="420" height="4" fill="url(#rule)"/>

  <text x="90" y="452" font-family="Helvetica,Arial,sans-serif" font-size="27"
        fill="#8fa3bf">Distributed systems &#183; Multi-tenant SaaS</text>

  <g font-family="Helvetica,Arial,sans-serif" font-size="23" font-weight="500">
    <rect x="90"  y="498" width="132" height="52" rx="26" fill="#ffffff" fill-opacity="0.07"/>
    <text x="156" y="531" fill="#dce6f5" text-anchor="middle">Node.js</text>

    <rect x="238" y="498" width="128" height="52" rx="26" fill="#ffffff" fill-opacity="0.07"/>
    <text x="302" y="531" fill="#dce6f5" text-anchor="middle">Python</text>

    <rect x="382" y="498" width="172" height="52" rx="26" fill="#ffffff" fill-opacity="0.07"/>
    <text x="468" y="531" fill="#dce6f5" text-anchor="middle">Kubernetes</text>

    <rect x="570" y="498" width="112" height="52" rx="26" fill="#ffffff" fill-opacity="0.07"/>
    <text x="626" y="531" fill="#dce6f5" text-anchor="middle">AWS</text>
  </g>
</svg>
